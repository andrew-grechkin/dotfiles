# The detector runs as a proxy on the gpg-agent socket and probes it on startup,
# which socket-activates gpg-agent. Starting it before the graphical session is
# initialized makes gpg-agent snapshot a pre-desktop environment, so pinentry
# cannot detect KDE and falls back to a light Qt theme.
#
# Move the service from default.target to graphical-session.target. The service
# Requires= its socket, so the socket is started at the same point instead of
# being enabled in sockets.target.
[Unit]
After=graphical-session.target
PartOf=graphical-session.target

[Install]
WantedBy=
WantedBy=graphical-session.target
